<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:684px;height:1416px;background:#FFFFFF;" width="684px" height="1416px" viewBox="0 0 684 1416" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="20" y="39.493" fill="#16324F" font-size="21" textLength="642.438" font-weight="700">Cómo las pruebas guiaron las mejoras implementadas</text></g><ellipse cx="340.219" cy="70.445" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="205.35" y="100.445" width="269.737" height="52.594" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="254.958" y="123.44" fill="#000" font-size="14" textLength="170.522">Implementar el contrato</text><text x="215.35" y="139.737" fill="#000" font-size="14" textLength="249.737">Endpoint, JSON y orden de similitud</text><rect x="145.772" y="173.039" width="388.895" height="52.594" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="178.094" y="196.034" fill="#000" font-size="14" textLength="324.249">Separar Controller / Service / ProductApiClient</text><text x="155.772" y="212.331" fill="#000" font-size="14" textLength="368.895">Inyección por constructor y responsabilidades claras</text><rect x="150.526" y="245.633" width="379.386" height="52.594" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="233.616" y="268.628" fill="#000" font-size="14" textLength="213.206">Acotar concurrencia y esperas</text><text x="160.526" y="284.925" fill="#000" font-size="14" textLength="359.386">4 detalles por petición; 6 s por detalle; 8 s globales</text><rect x="171.516" y="318.227" width="337.406" height="52.594" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="205.066" y="341.222" fill="#000" font-size="14" textLength="270.307">Verificar comportamiento con pruebas</text><text x="181.516" y="357.519" fill="#000" font-size="14" textLength="317.406">Orden, vacío, 404, fallos parciales y timeouts</text><rect x="262.225" y="390.82" width="155.987" height="36.297" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="272.225" y="413.815" fill="#000" font-size="14" textLength="135.987">Ejecutar k6 original</text><rect x="204.383" y="447.117" width="271.672" height="52.594" fill="#FFF8DB" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="235.701" y="470.112" fill="#000" font-size="14" textLength="209.036">Detectar que el script original</text><text x="214.383" y="486.409" fill="#000" font-size="14" textLength="251.672">no comprueba contenido ni estados</text><rect x="168.928" y="519.711" width="342.581" height="52.594" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="178.928" y="542.706" fill="#000" font-size="14" textLength="322.581">Agregar verificación de respuestas bajo carga</text><text x="242.516" y="559.003" fill="#000" font-size="14" textLength="195.405">sin modificar el test original</text><rect x="164.707" y="592.305" width="351.023" height="68.891" fill="#FEE2E2" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="257.067" y="615.3" fill="#000" font-size="14" textLength="166.305">Pool de 256 conexiones</text><text x="239.02" y="631.597" fill="#000" font-size="14" textLength="202.398">98,14 % de checks correctos</text><text x="174.707" y="647.894" fill="#000" font-size="14" textLength="331.023">410 fallos de contenido, incluidos 31 de estado</text><rect x="172.124" y="681.195" width="336.189" height="52.594" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="223.495" y="704.19" fill="#000" font-size="14" textLength="233.447">Ampliar el pool a 800 conexiones</text><text x="182.124" y="720.487" fill="#000" font-size="14" textLength="316.189">Mantener los límites por petición y los plazos</text><rect x="175.135" y="753.789" width="330.167" height="52.594" fill="#DCFCE7" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="185.135" y="776.784" fill="#000" font-size="14" textLength="310.167">Primera repetición: 18 478 checks correctos</text><text x="217.842" y="793.081" fill="#000" font-size="14" textLength="244.754">El contenido esperado se conserva</text><rect x="176.899" y="826.383" width="326.64" height="36.297" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="186.899" y="849.378" fill="#000" font-size="14" textLength="306.64">Revisar también registros del script original</text><rect x="179.353" y="882.68" width="321.731" height="52.594" fill="#FEE2E2" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="189.353" y="905.675" fill="#000" font-size="14" textLength="301.731">Detectar 4 cierres de conexión tras pausas</text><text x="210.856" y="921.972" fill="#000" font-size="14" textLength="258.727">3 fallos de IDs y 1 omisión de detalle</text><rect x="202.264" y="955.273" width="275.91" height="52.594" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="217.951" y="978.269" fill="#000" font-size="14" textLength="244.535">Retirar conexiones ociosas tras 2 s</text><text x="212.264" y="994.565" fill="#000" font-size="14" textLength="255.91">Limpieza cada 1 s; reutilización LIFO</text><rect x="167.274" y="1027.867" width="345.89" height="36.297" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="177.274" y="1050.862" fill="#000" font-size="14" textLength="325.89">Repetir pruebas, construcción y ambas cargas</text><rect x="179.76" y="1084.164" width="320.918" height="85.188" fill="#DCFCE7" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="287.955" y="1107.159" fill="#000" font-size="14" textLength="104.528">Resultado final</text><text x="220.132" y="1123.456" fill="#000" font-size="14" textLength="240.174">32 pruebas automáticas correctas</text><text x="205.992" y="1139.753" fill="#000" font-size="14" textLength="268.454">11 502 checks k6 correctos de 11 502</text><text x="189.76" y="1156.05" fill="#000" font-size="14" textLength="300.918">Sin fallos de conexión en las cargas finales</text><rect x="170.593" y="1189.352" width="339.252" height="52.594" fill="#EFF6FF" style="stroke:#3B638C;stroke-width:0.5;" rx="6" ry="6"/><text x="185.31" y="1212.347" fill="#000" font-size="14" textLength="309.818">Documentar decisiones, comandos y límites</text><text x="180.593" y="1228.644" fill="#000" font-size="14" textLength="319.252">Conservar resúmenes y fuentes para revisión</text><ellipse cx="340.219" cy="1272.945" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="340.219" cy="1272.945" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="340.219" y1="80.445" x2="340.219" y2="100.445" style="stroke:#334155;stroke-width:1;"/><polygon points="336.219,90.445,340.219,100.445,344.219,90.445,340.219,94.445" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="340.219" y1="153.039" x2="340.219" y2="173.039" style="stroke:#334155;stroke-width:1;"/><polygon points="336.219,163.039,340.219,173.039,344.219,163.039,340.219,167.039" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="340.219" y1="225.633" x2="340.219" y2="245.633" style="stroke:#334155;stroke-width:1;"/><polygon points="336.219,235.633,340.219,245.633,344.219,235.633,340.219,239.633" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="340.219" y1="298.227" x2="340.219" y2="318.227" style="stroke:#334155;stroke-width:1;"/><polygon points="336.219,308.227,340.219,318.227,344.219,308.227,340.219,312.227" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlim